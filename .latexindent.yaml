# latexindent (prek: LaTeX format) for cv/: two spaces, like .editorconfig.
# Only indentation changes; line breaks stay as written (no -m switch).
---
defaultIndent: "  "
# the document environment is indented in cv/ (main.tex, sections/)
noAdditionalIndent:
  document: 0
indentPreamble: 0
...

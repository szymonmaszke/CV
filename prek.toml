  priority = 70

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "06a39750ec31860bb44f2acf67182c40016cd1e7"  # frozen: v1.32.0

  [[repos.hooks]]
  id = "zizmor"
  alias = "github"
  name = "<<<CHECK>>> GitHub"
  verbose = true
  args = ["--no-progress", "--persona", "auditor"]
  priority = 70

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "a76b92851fc9eede9f9bc4073eb55202f34eb0df"  # frozen: 0.39.0

  [[repos.hooks]]
  id = "check-github-workflows"
  alias = "github-workflows"
  name = "<<<CHECK>>> GitHub Workflows"
  verbose = true
  priority = 70

  [[repos.hooks]]
  id = "check-jsonschema"
  alias = "github-workflows-timeout"
  name = "<<<CHECK>>> GitHub Workflows timeout"
  verbose = true
  args = ["--builtin-schema", "github-workflows-require-timeout"]
  files = "^\\.github/workflows/.*\\.ya?ml$"
  priority = 70

  [[repos.hooks]]
  id = "check-dependabot"
  alias = "github-dependabot"
  name = "<<<CHECK>>> GitHub Dependabot"
  verbose = true
  priority = 70

##############################################################################
#
#                         NPM BASED CHECKS (package.json)
#
##############################################################################

[[repos]]
repo = "local"

  [[repos.hooks]]
  id = "prek"
  verbose = true
  name = "<<<FIX>>> Prek"
  entry = "npm run --silent update:hooks"
  pass_filenames = false
  language = "system"
  require_serial = true
  always_run = true
  priority = 30

  # Runs on every commit, new advisories appear without lock changes
  [[repos.hooks]]
  id = "npm-audit"
  alias = "audit"
  verbose = true
  name = "<<<CHECK>>> npm audit"
  entry = "npm run --silent check:audit"
  pass_filenames = false
  language = "system"
  always_run = true
  priority = 30

  # Biome (biome.jsonc): formatting, linting and import sorting
  [[repos.hooks]]
  id = "js"
  verbose = true
  name = "<<<FIX>>> JS / TS / Astro / CSS"
  entry = "npm run --silent fix:js --"
  language = "system"
  require_serial = true
  files = "\\.(astro|[cm]?[jt]s|css|jsonc?)$"
  exclude = "^package-lock.json$"
  priority = 70

  # astro check: TypeScript, Astro templates and projects.yaml (content schema)
  [[repos.hooks]]
  id = "typing"
  verbose = true
  name = "<<<CHECK>>> Typing"
  entry = "npm run --silent check"
  pass_filenames = false
  language = "system"
  require_serial = true
  files = "(\\.(astro|[cm]?[jt]s)|^src/content/.*|^(tsconfig|package(-lock)?)\\.json)$"
  priority = 80

  [[repos.hooks]]
  id = "build"
  verbose = true
  name = "<<<CHECK>>> Build"
  entry = "npm run --silent build"
  pass_filenames = false
  language = "system"
  require_serial = true
  files = "^(src/.*|public/.*|astro\\.config\\.mjs|astro\\.env|package(-lock)?\\.json)$"
  priority = 90

---
name: "Policy"

on:
  pull_request:
    branches:
      - "main"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    timeout-minutes: 10
    name: "Policy"
    permissions:
      contents: "read"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          # Uses docker container,
          # disable-sudo-and-containers impossible
          disable-sudo: true
          egress-policy: "block"
          # Only the hosts the steps call (checkout; conform's image is pulled
          # before this step, conform itself stays offline); harden-runner allows
          # GitHub Actions' own (results, cache, artifacts, OIDC, codeload)
          allowed-endpoints: >
            github.com:443
      - name: "Checkout Repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          sparse-checkout: |
            .conform.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
          # Necessary for the conform action to work (commit ranges)
          # See here: https://github.com/siderolabs/conform/issues/231
          fetch-depth: 2
      - name: "Check policy compliance"
        uses: "siderolabs/conform@cfdb3cce90daece912e6a5cb3f20b2316a78a5bf" # v0.1.0-alpha.31
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
...

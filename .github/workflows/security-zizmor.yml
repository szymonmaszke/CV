# zizmor (https://docs.zizmor.sh) audits GitHub Actions workflows, same
# version and persona as the prek hook (prek.toml)

---
name: "Security zizmor"

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/*.yml"
      - ".github/dependabot.yml"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/*.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-zizmor:
    name: "Security zizmor"
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a" # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          # Only the hosts the steps call (checkout, the zizmor wheel that
          # zizmor-action installs from PyPI, its online audits); harden-runner
          # allows GitHub Actions' own (results, cache, artifacts, OIDC, codeload)
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Run zizmor"
        uses: "zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd" # v0.8.1
        with:
          version: "1.32.0"
          persona: "auditor"
          # Fail on findings (also in private repositories without code scanning)
          advanced-security: false
          annotations: true
...

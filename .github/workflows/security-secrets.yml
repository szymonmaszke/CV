---
name: "Security Secrets"

on:
  pull_request:
    branches:
      - "main"

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-secrets:
    timeout-minutes: 10
    permissions:
      # Only need to read contents
      contents: "read"
    name: "Security Secrets"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          # Uses docker container,
          # disable-sudo-and-containers impossible
          disable-sudo: true
          egress-policy: "block"
          # Only the hosts the steps call (checkout, TruffleHog's image pull);
          # harden-runner allows GitHub Actions' own (results, cache, artifacts,
          # OIDC, codeload)
          allowed-endpoints: >
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "TruffleHog OSS"
        uses: "trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb" # v3.99.8
        with:
          extra_args: "--debug --only-verified"
...

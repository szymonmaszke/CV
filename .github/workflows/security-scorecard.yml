# OpenSSF Scorecard (https://scorecard.dev) of the repository, published for
# the badge and uploaded to the Security tab. Public repositories only.

---
name: "Security Scorecard"

on:
  push:
    branches:
      - "main"
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

# enq: the only way to set permissions to none in GH Actions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: >
    ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scorecard:
    name: "Security Scorecard"
    if: >
      github.event.repository.visibility == 'public'
    timeout-minutes: 10
    runs-on: "ubuntu-latest"
    permissions:
      actions: "read" # https://github.com/github/codeql-action/issues/2117
      security-events: "write" # Needed to upload SARIF file to tab
      id-token: "write" # Needed for GitHub OIDC token to publish results
      contents: "read"
    # No run steps: ossf/scorecard-action verifies this job when publishing
    # results (only allowlisted actions)
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo: true
          egress-policy: "block"
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            api.securityscorecards.dev:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            github.com:443
            index.docker.io:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: "ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e" # v2.5.0
        with:
          results_file: "scorecard.sarif"
          results_format: "sarif"
          publish_results: true
      - name: "Upload SARIF file to GitHub Advanced Security Dashboard"
        # SARIF upload may fail if code scanning is not enabled
        continue-on-error: true
        uses: "github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d" # v4.38.3
        with:
          sarif_file: "scorecard.sarif"
          category: "/tool:scorecard/scope:repository/language:all"
...

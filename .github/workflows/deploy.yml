# Builds the site and the CV (light and dark, cv/) on every push and pull
# request; deploys `main` to GitHub Pages (maszke.co) and releases the deployed
# commit as the next vX.Y.Z (conventional commits). Also rebuilt daily, so the
# GitHub and StackOverflow numbers (`npm run update:stats`, refreshed on every
# deploy) stay current.
# Actions are pinned to commit SHAs (Dependabot keeps them up to date).

---
name: "deploy"

on:
  push:
    branches:
      - "main"
  pull_request:
  schedule:
    # daily, off the hour (the stats refresh below)
    - cron: "23 4 * * *"
  workflow_dispatch:

# enq: GitHub accepts only an empty mapping to drop all default permissions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read" # checkout of the repository
    steps:
      - name: "Harden runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          # sudo stays: apt-get installs XeLaTeX
          egress-policy: "block"
          # Only the hosts the steps call: checkout, npm ci, the stats refresh
          # (GitHub, StackExchange) and apt-get (the runner's three apt
          # sources); harden-runner allows GitHub Actions' own (results, cache,
          # artifacts, OIDC, codeload)
          allowed-endpoints: >
            api.github.com:443
            api.stackexchange.com:443
            azure.archive.ubuntu.com:80
            esm.ubuntu.com:443
            github.com:443
            packages.microsoft.com:443
            registry.npmjs.org:443

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js"
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: "Install dependencies"
        run: "npm ci"

      - name: "Refresh GitHub and StackOverflow numbers"
        # Not on pull requests (their builds use the committed numbers). An API
        # outage keeps the committed numbers instead of blocking the deploy;
        # the refreshed files are validated by the next step.
        if: "github.event_name != 'pull_request'"
        continue-on-error: true
        env:
          GITHUB_TOKEN: "${{ github.token }}" # higher GitHub API rate limit
        run: "npm run update:stats"

      - name: "Check types and content"
        run: "npm run check"

      - name: "Test content rendering"
        run: "npm test"

      - name: "Install XeLaTeX"
        # Ubuntu's TeX Live packages: XeTeX plus the fonts (Lato, FontAwesome)
        # and LaTeX packages cv/main.tex loads. Ubuntu's texlive-fonts-extra
        # strips FontAwesome.otf and Lato-*.ttf (shipped by fonts-font-awesome
        # and fonts-lato, only recommended, so skipped by
        # --no-install-recommends): install them explicitly.
        # texlive-fonts-recommended: pzdr (ZapfDingbats), loaded by hyperref
        run: >
          sudo apt-get update
          && sudo apt-get install --yes --no-install-recommends
          texlive-xetex
          texlive-latex-recommended
          texlive-latex-extra
          texlive-pictures
          texlive-plain-generic
          texlive-fonts-recommended
          texlive-fonts-extra
          fonts-font-awesome
          fonts-lato

      - name: "Build CV (light and dark)"
        # public/szymon-maszke-cv.pdf and public/szymon-maszke-cv-dark.pdf,
        # copied into the site by the next step
        run: "npm run build:cv"

      - name: "Build"
        run: "npm run build"

      - name: "Check the CVs are in the site"
        run: >
          test -s dist/szymon-maszke-cv.pdf
          && test -s dist/szymon-maszke-cv-dark.pdf

      - name: "Upload CVs"
        # Downloadable from the run's summary, also for pull requests
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: "cv"
          path: |
            dist/szymon-maszke-cv.pdf
            dist/szymon-maszke-cv-dark.pdf
          if-no-files-found: "error"
          retention-days: 30

      - name: "Upload site"
        if: "github.event_name != 'pull_request'"
        uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
        with:
          path: "dist"

  deploy:
    name: "Deploy"
    needs: "build"
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      pages: "write" # publish the site to GitHub Pages
      id-token: "write" # OIDC token that proves the deployment's origin to Pages
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: "Harden runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          # Only the host the step calls (the Pages deployment API); the OIDC
          # token comes from GitHub Actions' own hosts, which harden-runner
          # allows (results, cache, artifacts, OIDC, codeload)
          allowed-endpoints: >
            api.github.com:443

      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1

  # Version lives in tags only: main accepts squash-merged pull requests, so
  # no bump can be committed back (package.json stays 0.0.0). The daily run
  # reaches this job too, but releases nothing without new feat or fix commits
  # (and catches up on a release a failed push run missed).
  release:
    name: "Release"
    needs: "deploy"
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    permissions:
      contents: "write" # create the vX.Y.Z tag and its GitHub release
    steps:
      - name: "Harden runner"
        uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          # Only the host the steps call (gh api, gh release); harden-runner
          # allows GitHub Actions' own (results, cache, artifacts, OIDC, codeload)
          allowed-endpoints: >
            api.github.com:443

      # Commits since the latest vX.Y.Z tag (or all of them, starting from
      # 0.0.0): `!` or BREAKING CHANGE bumps major, feat minor, fix patch
      - name: "Compute version"
        env:
          GH_TOKEN: "${{ github.token }}"
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation rule:line-length
        run: |
          number='(0|[1-9][0-9]*)'
          latest="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --jq '.[].ref | ltrimstr("refs/tags/v")' \
              | { grep -E "^${number}\.${number}\.${number}$" || true; } \
              | sort -V \
              | tail -n 1
          )"
          # Bump of a commit message: 3 major, 2 minor, 1 patch, 0 none
          level='
            (split("\n")[0]) as $header
            | if ($header | test("^[a-z]+([(][^)]*[)])?!: "))
                or test("(^|\n)BREAKING[ -]CHANGE: ") then 3
              elif ($header | test("^feat([(][^)]*[)])?: ")) then 2
              elif ($header | test("^fix([(][^)]*[)])?: ")) then 1
              else 0 end'
          if [[ -n "${latest}" ]]; then
            levels="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/v${latest}...${GITHUB_SHA}" \
                --jq ".commits[].commit.message | ${level}"
            )"
          else
            levels="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/commits?sha=${GITHUB_SHA}&per_page=100" \
                --jq ".[].commit.message | ${level}"
            )"
          fi
          bump="$(sort -n <<< "${levels}" | tail -n 1)"
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
          case "${bump:-0}" in
            3) major=$((major + 1)); minor=0; patch=0 ;;
            2) minor=$((minor + 1)); patch=0 ;;
            1) patch=$((patch + 1)) ;;
            *)
              echo "::notice title=No release::No feat, fix or breaking commits since v${latest:-0.0.0}"
              exit 0
              ;;
          esac
          echo "TAG=v${major}.${minor}.${patch}" >> "${GITHUB_ENV}"
        # yamllint enable rule:indentation rule:line-length

      # Creates the tag too; fails if it exists or violates the tag rulesets
      - name: "Create release"
        if: "env.TAG != ''"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: >
          gh release create "${TAG}" --target "${GITHUB_SHA}"
          --title "${TAG}" --generate-notes --latest
...

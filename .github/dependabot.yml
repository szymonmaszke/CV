# Weekly, grouped updates. `cooldown` waits 7 days after a release before
# proposing it (supply-chain hardening). `fix` commit prefix: pull request titles
# pass the Pull Request check (pull-request.yml). prek hooks are updated by prek
# itself (prek.toml, `npm run update:hooks`).

---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      development:
        dependency-type: "development"
    ignore:
      # @astrojs/check 0.9.x peer-depends on typescript ^5 || ^6; drop once it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
    groups:
      actions:
        patterns:
          - "*"
...
